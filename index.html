<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Egilsson</title>
<meta name="description" content="A personal page for hosting and building side projects and hobbies.">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0f1521">
<meta name="darkreader-lock">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="assets/site.css">
<style>
.hero{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;gap:clamp(16px,4vw,30px);padding-block:48px}
h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:clamp(52px,12vw,112px);line-height:.95;letter-spacing:-.02em}
h1{position:relative}
.dot{font:inherit;color:var(--accent);background:none;border:0;padding:0;margin:0;cursor:pointer;line-height:inherit;display:inline-block;transform-origin:50% 80%;transition:transform .3s cubic-bezier(.3,1.6,.5,1),color .15s}
.dot:hover{color:var(--feat-a)}
.dot[aria-expanded="true"]{color:var(--feat-a);transform:scale(.94,1.08)}
.dot:focus-visible{outline-offset:-0.08em;border-radius:.12em}
/* Location menu: a stream drips from the dot, each option slides down it as a drop and then opens out. */
.wx-menu{position:absolute;z-index:40;left:var(--menu-x,0px);top:100%;margin-top:14px;display:flex;flex-direction:column;gap:8px;min-width:310px;font-family:var(--f-body);font-size:15px;letter-spacing:0;line-height:1.3;pointer-events:none;visibility:hidden}
.wx-menu.open,.wx-menu.closing{visibility:visible}
.wx-menu.open{pointer-events:auto}
.wx-stream{position:absolute;left:18px;top:calc(var(--s,40px) * -1);width:3px;height:calc(var(--s,40px) + var(--len,200px));border-radius:0 0 3px 3px;background:linear-gradient(var(--feat-a),var(--accent));transform-origin:50% 0;transform:scaleY(0);transition:transform .32s cubic-bezier(.55,0,.75,.3) .12s}
.wx-menu.open .wx-stream{transform:scaleY(1);transition:transform calc(var(--n,4) * 110ms + 140ms) cubic-bezier(.45,.05,.55,.95)}
.wx-menu button{position:relative;display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:linear-gradient(160deg,var(--surface2),var(--surface));color:var(--fg);font:inherit;cursor:pointer;box-shadow:0 10px 24px rgba(0,0,0,.35);clip-path:ellipse(0px 0px at 19px 50%);transition:border-color .15s}
.wx-menu.open button{animation:wx-drip .62s cubic-bezier(.35,0,.25,1) calc(var(--i) * 110ms + 60ms) both}
.wx-menu.closing button{animation:wx-drip-back .34s cubic-bezier(.5,0,.75,0) calc((var(--n,4) - 1 - var(--i)) * 50ms) both reverse}
@keyframes wx-drip{
  0%{transform:translateY(calc(var(--d,60px) * -1));clip-path:ellipse(0px 0px at 19px 50%)}
  12%{transform:translateY(calc(var(--d,60px) * -1));clip-path:ellipse(5px 6px at 19px 50%)}
  55%{transform:translateY(0);clip-path:ellipse(4px 8px at 19px 50%)}
  66%{transform:translateY(0);clip-path:ellipse(9px 7px at 19px 50%)}
  100%{transform:none;clip-path:ellipse(240% 240% at 19px 50%)}}
@keyframes wx-drip-back{
  0%{transform:translateY(calc(var(--d,60px) * -1));clip-path:ellipse(0px 0px at 19px 50%)}
  12%{transform:translateY(calc(var(--d,60px) * -1));clip-path:ellipse(5px 6px at 19px 50%)}
  55%{transform:translateY(0);clip-path:ellipse(4px 8px at 19px 50%)}
  66%{transform:translateY(0);clip-path:ellipse(9px 7px at 19px 50%)}
  100%{transform:none;clip-path:ellipse(240% 240% at 19px 50%)}}
.wx-menu button:hover,.wx-menu button:focus-visible{border-color:var(--accent)}
/* Narrow screens: the options are empty containers that fill up as the stream drips past them. */
.wx-menu.m{left:0;right:0;min-width:0}
.wx-menu.m .wx-stream{left:var(--sx,50%);z-index:2;height:calc(var(--s,40px) + var(--len,200px));transition:transform .26s cubic-bezier(.55,0,.75,.3) .2s}
.wx-menu.m.open .wx-stream{transition:transform var(--sd,600ms) cubic-bezier(.35,.1,.6,1)}
.wx-menu.m button,.wx-menu.m.open button,.wx-menu.m.closing button{animation:none;clip-path:none;transform:none;isolation:isolate;z-index:1;background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-color:transparent;box-shadow:none;opacity:0;
  transition:border-color .2s ease .22s,box-shadow .2s ease,opacity .18s ease .25s}
.wx-menu.m button::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;background:linear-gradient(160deg,var(--surface2),var(--surface));box-shadow:inset 0 2px 0 var(--accent);transform:scaleY(0);transform-origin:50% 100%;
  transition:transform .16s cubic-bezier(.5,0,.75,0) calc((var(--n,4) - 1 - var(--i)) * 35ms),box-shadow .2s}
.wx-menu.m button>*{opacity:0;transition:opacity .12s}
.wx-menu.m.open button{opacity:1;border-color:var(--line);box-shadow:0 10px 24px rgba(0,0,0,.35);transition:opacity .12s,border-color .12s,box-shadow .3s ease var(--ft,0ms)}
.wx-menu.m.settled .wx-stream{transform-origin:50% 100%;transform:scaleY(0);transition:transform .22s cubic-bezier(.55,0,.75,.3)}
.wx-menu.m.open button::before{transform:scaleY(1);box-shadow:inset 0 0 0 transparent;transition:transform .24s cubic-bezier(.2,.7,.3,1) var(--ft,0ms),box-shadow .3s ease calc(var(--ft,0ms) + .2s)}
.wx-menu.m.open button>*{opacity:1;transition:opacity .18s ease calc(var(--ft,0ms) + .12s)}
.wx-menu.m.open button:hover,.wx-menu.m.open button:focus-visible{border-color:var(--accent)}
.wx-pin{flex:none;width:9px;height:9px;border-radius:50%;border:1.5px solid var(--muted);background:var(--surface)}
.wx-menu button[aria-checked="true"] .wx-pin{background:var(--accent);border-color:var(--accent)}
.wx-mn{font-weight:600;white-space:nowrap}
.wx-mn em{font-style:normal;font-weight:500;font-size:11px;color:var(--accent);background:var(--accent-soft);border-radius:99px;padding:2px 7px;margin-left:4px;vertical-align:1px}
.wx-menu small{margin-left:auto;padding-left:10px;font-size:12px;color:var(--muted)}
.wx-switching{opacity:.55;transition:opacity .2s}
@media (prefers-reduced-motion: reduce){.wx-menu.m *,.wx-menu.m *::before{transition:none!important}.wx-menu.open button,.wx-menu.closing button{animation:none}.wx-menu.open button{clip-path:none}.wx-stream{display:none}}
p{margin:0;max-width:34em;color:var(--fg2);font-size:clamp(15px,2.2vw,18px)}
nav{display:grid;grid-template-columns:1fr 1fr;gap:clamp(10px,1.6vw,14px);max-width:720px}
nav a{display:flex;align-items:center;gap:14px;padding:clamp(12px,2vw,18px) clamp(14px,2.2vw,20px);background:linear-gradient(160deg,var(--surface2),var(--surface));border:1px solid var(--line);border-radius:14px;text-decoration:none;min-width:0;transition:border-color .15s,transform .15s}
nav a:hover{border-color:var(--accent);transform:translateY(-2px)}
.ic{flex:none;width:42px;height:42px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.ic svg{width:22px;height:22px}
nav div{min-width:0}
nav b{display:block;font-family:var(--f-display);font-weight:600;font-size:clamp(16px,2.4vw,20px)}
nav small{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.go{margin-left:auto;color:var(--muted);flex:none}
@media (max-width:440px){nav{grid-template-columns:1fr}}
.wx{max-width:720px;padding:clamp(16px,2.6vw,22px) clamp(16px,2.8vw,24px);background:linear-gradient(160deg,var(--surface2),var(--surface));border:1px solid var(--line);border-radius:14px;min-height:150px}
.wx a{color:var(--accent);text-decoration:none}.wx a:hover{text-decoration:underline}
.wx-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.wx-place{font-family:var(--f-display);font-weight:600;font-size:clamp(16px,2.4vw,20px);margin-right:10px}
.wx-sub{font-size:13px;color:var(--muted)}
.wx-now{display:flex;align-items:center;gap:clamp(12px,2.4vw,20px)}
.wi{width:24px;height:24px;color:var(--accent);flex:none}
.wi-big{width:clamp(44px,8vw,58px);height:clamp(44px,8vw,58px)}
.wx-temp{font-family:var(--f-display);font-weight:700;font-size:clamp(44px,9vw,64px);line-height:1;letter-spacing:-.02em}
.wx-temp span{font-size:.4em;color:var(--muted);font-weight:600;margin-left:2px;vertical-align:top;position:relative;top:.25em}
.wx-facts{display:flex;flex-direction:column;gap:2px;min-width:0;font-size:14px;color:var(--fg2)}
.wx-facts b{font-family:var(--f-display);font-weight:600;font-size:clamp(15px,2.2vw,18px);color:var(--fg)}
.wx-facts span{display:flex;align-items:center;gap:5px}
.wdir{width:14px;height:14px;flex:none;color:var(--muted)}
.wx-hours{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.wx-h{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:13px;color:var(--muted)}
.wx-h small{font-family:var(--f-mono);font-size:12px}
.wx-h b{font-weight:600;color:var(--fg);font-size:15px}
.wx-h span{display:flex;align-items:center;gap:2px;font-size:12px}
.wx-days{display:flex;flex-direction:column;gap:2px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.wx-d{display:grid;grid-template-columns:72px 24px 34px 1fr 34px 58px;align-items:center;gap:10px;padding:5px 0;font-size:14px}
.wx-dn{font-weight:600}.wx-dn small{font-weight:400;color:var(--muted);font-size:12px}
.wx-lo{color:var(--muted);text-align:right}.wx-hi{font-weight:600}
.wx-bar{position:relative;height:6px;border-radius:99px;background:var(--line)}
.wx-bar i{position:absolute;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,var(--accent-2),var(--accent))}
.wx-wind{font-size:12px;color:var(--muted);text-align:right;font-family:var(--f-mono)}
.wx-err{font-size:14px}
@media (max-width:560px){.wx-hours{grid-template-columns:repeat(4,minmax(0,1fr));row-gap:14px}.wx-d{grid-template-columns:60px 22px 30px 1fr 30px;gap:8px}.wx-wind{display:none}}
.intro{display:flex;flex-direction:column;gap:clamp(16px,4vw,30px);min-width:0}
@media (min-width:1000px){
  .page.home{max-width:1280px;padding-left:max(40px, env(safe-area-inset-left, 0px));padding-right:max(40px, env(safe-area-inset-right, 0px))}
  .hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);grid-template-areas:"title ." "wx nav";align-content:center;align-items:start;column-gap:clamp(28px,3.5vw,48px);row-gap:clamp(28px,3.5vw,44px)}
  .intro{display:contents}
  h1{grid-area:title}
  .wx{grid-area:wx;max-width:none}
  nav{grid-area:nav;grid-template-columns:1fr;max-width:none}
  h1{font-size:clamp(72px,7.6vw,112px)}
}
</style>
</head>
<body>
<main class="page home">
  <div class="hero">
    <div class="intro">
    <h1>Egilsson<button type="button" id="wx-dot" class="dot" aria-haspopup="menu" aria-expanded="false" aria-label="Choose weather location" title="Weather location">.</button></h1>
    </div>
    <section id="weather" class="wx" aria-label="Weather in Akureyri" aria-busy="true" aria-live="polite"><span class="wx-sub">Loading weather from vedur.is…</span></section>
    <nav>
      <a href="utilities/"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></span><div><b>Utilities</b><small>Search and Plex server</small></div><span class="go">→</span></a>
      <a href="checklist/"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m4 7 2 2 4-4M4 17l2 2 4-4M14 7h6M14 17h6"/></svg></span><div><b>Checklist</b><small>Night shift tasks</small></div><span class="go">→</span></a>
    </nav>
  </div>
</main>
<script src="assets/weather.js?v=6" defer></script>
</body>
</html>
