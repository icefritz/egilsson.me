<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Egilsson</title>
<meta name="description" content="A personal page for hosting and building side projects and hobbies.">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0f1521">
<meta name="darkreader-lock">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="assets/site.css">
<style>
.hero{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;gap:clamp(16px,4vw,30px);padding-block:48px}
h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:clamp(52px,12vw,112px);line-height:.95;letter-spacing:-.02em}
h1{position:relative}
.dot{font:inherit;color:var(--accent);background:none;border:0;padding:14px 16px;margin:-14px -16px;cursor:pointer;line-height:inherit;display:inline-block;transition:color .15s}
.dot:hover,.dot[aria-expanded="true"]{color:var(--feat-a)}
.dot:focus-visible{outline-offset:-0.08em;border-radius:.12em}
/* Location menu: a plain dropdown under the dot (full width on phones). */
.wx-menu{position:absolute;z-index:40;left:var(--menu-x,0px);top:100%;margin-top:10px;display:flex;flex-direction:column;gap:0;min-width:310px;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 24px rgba(0,0,0,.35);padding:4px 0;font-family:var(--f-body);font-size:15px;letter-spacing:0;line-height:1.3;
  visibility:hidden;pointer-events:none;clip-path:inset(0 -30px 100% -30px);transition:clip-path .18s cubic-bezier(.4,0,1,1),visibility 0s linear .18s}
.wx-menu.open{visibility:visible;pointer-events:auto;clip-path:inset(-20px -30px -40px -30px);transition:clip-path .3s cubic-bezier(.2,.8,.3,1),visibility 0s}
.wx-menu.m{left:0;right:0;min-width:0}
.wx-menu.m::after{content:"";position:absolute;inset:-10px -6px;z-index:-1;border-radius:18px;background:var(--bg);opacity:1}
.wx-menu button{position:relative;display:flex;align-items:center;gap:10px;width:100%;text-align:left;min-height:44px;padding:12px 14px;border:0;border-top:1px solid var(--line);border-radius:0;background:none;color:var(--fg);font:inherit;cursor:pointer;box-shadow:none;
  opacity:0;transform:translateY(-8px);transition:opacity .12s,transform .18s,border-color .15s}
.wx-menu.open button{opacity:1;transform:none;transition:opacity .2s ease calc(var(--i) * 40ms + 40ms),transform .3s cubic-bezier(.2,.8,.3,1) calc(var(--i) * 40ms),border-color .15s}
.wx-menu button:first-child{border-top:0}
.wx-menu button:hover,.wx-menu button:focus-visible{background:var(--surface2)}
.wx-pin{flex:none;width:9px;height:9px;border-radius:50%;border:1.5px solid var(--muted)}
.wx-menu button[aria-checked="true"] .wx-pin{background:var(--accent);border-color:var(--accent)}
.wx-mn{font-weight:600;white-space:nowrap}
.wx-mn em{font-style:normal;font-weight:500;font-size:13px;color:var(--muted);margin-left:6px}
.wx-menu small{margin-left:auto;padding-left:10px;font-size:13px;color:var(--muted)}
.wx-switching{opacity:.55;transition:opacity .2s}
@media (prefers-reduced-motion: reduce){.wx-menu,.wx-menu button{transition:none!important}}
p{margin:0;max-width:34em;color:var(--fg2);font-size:clamp(15px,2.2vw,18px)}
nav{display:flex;flex-direction:column;max-width:720px;border-top:1px solid var(--line)}
nav a{display:flex;align-items:center;gap:14px;padding:clamp(12px,2vw,16px) 0;border-bottom:1px solid var(--line);color:var(--fg);text-decoration:none;min-width:0;transition:border-color .15s}
nav a:hover{border-color:var(--accent)}
nav div{min-width:0}
nav b{display:block;font-family:var(--f-display);font-weight:600;font-size:clamp(16px,2.4vw,20px)}
nav small{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.go{margin-left:auto;color:var(--muted);flex:none}
.wx{max-width:720px;padding:clamp(16px,2.6vw,22px) clamp(16px,2.8vw,24px);background:var(--surface);border:1px solid var(--line);border-radius:8px;min-height:150px}
.wx a{color:var(--accent);text-decoration:none}.wx a:hover{text-decoration:underline}
.wx-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.wx-place{font-family:var(--f-display);font-weight:600;font-size:clamp(16px,2.4vw,20px);margin-right:10px}
.wx-sub{font-size:13px;color:var(--muted)}
.wx-now{display:flex;align-items:center;gap:clamp(12px,2.4vw,20px)}
.wi{width:24px;height:24px;color:var(--fg2);flex:none}
.wi-big{width:clamp(44px,8vw,58px);height:clamp(44px,8vw,58px)}
.wx-temp{font-family:var(--f-display);font-weight:700;font-size:clamp(44px,9vw,64px);line-height:1;letter-spacing:-.02em}
.wx-temp span{font-size:.4em;color:var(--muted);font-weight:600;margin-left:2px;vertical-align:top;position:relative;top:.25em}
.wx-facts{display:flex;flex-direction:column;gap:2px;min-width:0;font-size:14px;color:var(--fg2)}
.wx-facts b{font-family:var(--f-display);font-weight:600;font-size:clamp(15px,2.2vw,18px);color:var(--fg)}
.wx-facts span{display:flex;align-items:center;gap:5px}
.wdir{width:14px;height:14px;flex:none;color:var(--muted)}
.wx-hours{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.wx-h{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:13px;color:var(--muted)}
.wx-h small{font-family:var(--f-mono);font-size:13px}
.wx-h b{font-weight:600;color:var(--fg);font-size:15px}
.wx-h span{display:flex;align-items:center;gap:2px;font-size:13px}
.wx-days{display:flex;flex-direction:column;gap:2px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.wx-d{display:grid;grid-template-columns:72px 24px 34px 1fr 34px 58px;align-items:center;gap:10px;padding:5px 0;font-size:14px}
.wx-dn{font-weight:600}.wx-dn small{font-weight:400;color:var(--muted);font-size:13px}
.wx-lo{color:var(--muted);text-align:right}.wx-hi{font-weight:600}
.wx-bar{position:relative;height:6px;border-radius:99px;background:var(--line)}
.wx-bar i{position:absolute;top:0;bottom:0;border-radius:99px;background:var(--muted)}
.wx-wind{font-size:13px;color:var(--muted);text-align:right;font-family:var(--f-mono)}
.wx-foot{margin:14px 0 0;padding-top:10px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);max-width:none}
.wx-err{font-size:14px}
@media (max-width:560px){.wx-hours{grid-template-columns:repeat(4,minmax(0,1fr));row-gap:14px}.wx-d{grid-template-columns:76px 22px 30px 1fr 30px 56px;gap:8px}.wx-dn{white-space:nowrap}.wx-d:nth-child(n+5){display:none}}
@media (max-width:560px){.hero{padding-block:24px}.wx-hours{margin-top:14px;padding-top:12px}.wx-foot{margin-top:10px}}
@media (max-width:560px) and (max-height:760px){.wx-h:nth-child(n+5){display:none}}
.intro{display:flex;flex-direction:column;gap:clamp(16px,4vw,30px);min-width:0}
@media (min-width:1000px){
  .page.home{max-width:1280px;padding-left:max(40px, env(safe-area-inset-left, 0px));padding-right:max(40px, env(safe-area-inset-right, 0px))}
  .hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);grid-template-areas:"title ." "wx nav";align-content:center;align-items:start;column-gap:clamp(28px,3.5vw,48px);row-gap:clamp(28px,3.5vw,44px)}
  .intro{display:contents}
  h1{grid-area:title}
  .wx{grid-area:wx;max-width:none}
  nav{grid-area:nav;max-width:none}
  h1{font-size:clamp(72px,7.6vw,112px)}
}
</style>
</head>
<body>
<main class="page home">
  <div class="hero">
    <div class="intro">
    <h1>Egilsson<button type="button" id="wx-dot" class="dot" aria-haspopup="menu" aria-expanded="false" aria-label="Choose weather location" title="Weather location">.</button></h1>
    </div>
    <section id="weather" class="wx" aria-label="Weather in Akureyri" aria-busy="true" aria-live="polite"><span class="wx-sub">Loading weather from vedur.is…</span></section>
    <nav>
      <a href="utilities/"><div><b>Utilities</b><small>Search and Plex server</small></div><span class="go">→</span></a>
      <a href="checklist/"><div><b>Checklist</b><small>Night shift tasks</small></div><span class="go">→</span></a>
      <a href="streaming/"><div><b>Streaming</b><small>What's on in Iceland</small></div><span class="go">→</span></a>
    </nav>
  </div>
</main>
<script src="assets/weather.js?v=7" defer></script>
</body>
</html>
