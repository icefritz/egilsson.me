<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Egilsson</title>
<meta name="description" content="A personal page for hosting and building side projects and hobbies.">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0f1521">
<meta name="darkreader-lock">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="assets/site.css">
<style>
.hero{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;gap:clamp(16px,4vw,30px);padding-block:48px}
h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:clamp(52px,12vw,112px);line-height:.95;letter-spacing:-.02em}
h1 span{color:var(--accent)}
p{margin:0;max-width:34em;color:var(--fg2);font-size:clamp(15px,2.2vw,18px)}
nav{display:grid;grid-template-columns:1fr 1fr;gap:clamp(10px,1.6vw,14px);max-width:720px}
nav a{display:flex;align-items:center;gap:14px;padding:clamp(12px,2vw,18px) clamp(14px,2.2vw,20px);background:linear-gradient(160deg,var(--surface2),var(--surface));border:1px solid var(--line);border-radius:14px;text-decoration:none;min-width:0;transition:border-color .15s,transform .15s}
nav a:hover{border-color:var(--accent);transform:translateY(-2px)}
.ic{flex:none;width:42px;height:42px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.ic svg{width:22px;height:22px}
nav div{min-width:0}
nav b{display:block;font-family:var(--f-display);font-weight:600;font-size:clamp(16px,2.4vw,20px)}
nav small{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.go{margin-left:auto;color:var(--muted);flex:none}
@media (max-width:440px){nav{grid-template-columns:1fr}}
.wx{max-width:720px;padding:clamp(16px,2.6vw,22px) clamp(16px,2.8vw,24px);background:linear-gradient(160deg,var(--surface2),var(--surface));border:1px solid var(--line);border-radius:14px;min-height:150px}
.wx a{color:var(--accent);text-decoration:none}.wx a:hover{text-decoration:underline}
.wx-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.wx-place{font-family:var(--f-display);font-weight:600;font-size:clamp(16px,2.4vw,20px);margin-right:10px}
.wx-sub{font-size:13px;color:var(--muted)}
.wx-now{display:flex;align-items:center;gap:clamp(12px,2.4vw,20px)}
.wi{width:24px;height:24px;color:var(--accent);flex:none}
.wi-big{width:clamp(44px,8vw,58px);height:clamp(44px,8vw,58px)}
.wx-temp{font-family:var(--f-display);font-weight:700;font-size:clamp(44px,9vw,64px);line-height:1;letter-spacing:-.02em}
.wx-temp span{font-size:.4em;color:var(--muted);font-weight:600;margin-left:2px;vertical-align:top;position:relative;top:.25em}
.wx-facts{display:flex;flex-direction:column;gap:2px;min-width:0;font-size:14px;color:var(--fg2)}
.wx-facts b{font-family:var(--f-display);font-weight:600;font-size:clamp(15px,2.2vw,18px);color:var(--fg)}
.wx-facts span{display:flex;align-items:center;gap:5px}
.wdir{width:14px;height:14px;flex:none;color:var(--muted)}
.wx-hours{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.wx-h{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:13px;color:var(--muted)}
.wx-h small{font-family:var(--f-mono);font-size:12px}
.wx-h b{font-weight:600;color:var(--fg);font-size:15px}
.wx-h span{display:flex;align-items:center;gap:2px;font-size:12px}
.wx-days{display:flex;flex-direction:column;gap:2px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.wx-d{display:grid;grid-template-columns:72px 24px 34px 1fr 34px 58px;align-items:center;gap:10px;padding:5px 0;font-size:14px}
.wx-dn{font-weight:600}.wx-dn small{font-weight:400;color:var(--muted);font-size:12px}
.wx-lo{color:var(--muted);text-align:right}.wx-hi{font-weight:600}
.wx-bar{position:relative;height:6px;border-radius:99px;background:var(--line)}
.wx-bar i{position:absolute;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,var(--accent-2),var(--accent))}
.wx-wind{font-size:12px;color:var(--muted);text-align:right;font-family:var(--f-mono)}
.wx-err{font-size:14px}
@media (max-width:560px){.wx-hours{grid-template-columns:repeat(4,minmax(0,1fr));row-gap:14px}.wx-d{grid-template-columns:60px 22px 30px 1fr 30px;gap:8px}.wx-wind{display:none}}
.intro{display:flex;flex-direction:column;gap:clamp(16px,4vw,30px);min-width:0}
@media (min-width:1000px){
  .page.home{max-width:1280px;padding-left:max(40px, env(safe-area-inset-left, 0px));padding-right:max(40px, env(safe-area-inset-right, 0px))}
  .hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);grid-template-areas:"intro ." "wx nav";align-content:center;align-items:start;column-gap:clamp(28px,3.5vw,48px);row-gap:clamp(28px,3.5vw,44px)}
  .intro{grid-area:intro}
  .wx{grid-area:wx;max-width:none}
  nav{grid-area:nav;grid-template-columns:1fr;max-width:none}
  h1{font-size:clamp(72px,7.6vw,112px)}
}
</style>
</head>
<body>
<main class="page home">
  <div class="hero">
    <div class="intro">
    <h1>Egilsson<span>.</span></h1>
    <p>A personal page for hosting and building side projects and hobbies. Above all, it's my own productivity tool and starting point for getting around.</p>
    </div>
    <nav>
      <a href="utilities/"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></span><div><b>Utilities</b><small>Search and Plex server</small></div><span class="go">→</span></a>
      <a href="checklist/"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m4 7 2 2 4-4M4 17l2 2 4-4M14 7h6M14 17h6"/></svg></span><div><b>Checklist</b><small>Night shift tasks</small></div><span class="go">→</span></a>
    </nav>
    <section id="weather" class="wx" aria-label="Weather in Akureyri" aria-busy="true" aria-live="polite"><span class="wx-sub">Loading weather from vedur.is…</span></section>
  </div>
</main>
<script src="assets/weather.js" defer></script>
</body>
</html>
