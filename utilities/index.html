<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Egilsson - Utilities</title>
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0f1521">
<meta name="darkreader-lock">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png">
<link rel="apple-touch-icon" href="../assets/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="../assets/site.css">
<style>
h1{margin:0 0 20px;font-family:var(--f-display);font-weight:700;font-size:clamp(30px,6vw,44px);line-height:1.05}
form{display:flex;align-items:stretch;gap:0;min-height:44px;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:0 0 0 14px;transition:border-color .2s,box-shadow .2s;margin-bottom:34px}
form:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 28%,transparent)}
form svg{flex:none;align-self:center;margin-right:10px;width:18px;height:18px;color:var(--muted)}
input{flex:1;min-width:0;font:inherit;font-size:16px;color:var(--fg);background:none;border:0;outline:none;padding:10px 0}
input:focus,input:focus-visible{outline:none}
input::placeholder{color:var(--muted)}
button{font:inherit;font-weight:600;cursor:pointer;border:0;border-radius:0;min-height:44px;padding:0 20px;background:var(--accent);color:var(--on-accent)}
button:hover{background:var(--accent-2)}
h2{display:flex;align-items:center;gap:10px;margin:0 0 12px;font-family:var(--f-mono);font-size:12px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
/* No decorative marker before headings. */
.grid{border-top:1px solid var(--line)}
.grid a{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:14px 0;border-bottom:1px solid var(--line);color:var(--fg);text-decoration:none;min-width:0;transition:border-color .15s}
.grid a:hover{border-color:var(--accent)}
.grid b{font-family:var(--f-display);font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.grid span{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none}
@media (max-width:560px){
  button{padding:0 14px}
}
</style>
</head>
<body>
<main class="page narrow">
  <a class="back" href="../" aria-label="Back to home"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="chev" d="M11.5 4.5 4 12l7.5 7.5" fill="none" stroke-width="3.4" stroke-linecap="square" stroke-linejoin="miter"/><rect class="dash" x="10" y="10.2" width="11" height="3.6"/></svg>Back</a>
  <h1>Utilities</h1>
  <form action="https://search.brave.com/search" method="get" target="_blank" role="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input type="search" name="q" required placeholder="Search with Brave" aria-label="Search with Brave" autocomplete="off">
    <button type="submit">Search</button>
  </form>
  <section>
    <h2>Plex Server</h2>
    <div class="grid">
      <a href="https://whatbox.ca/manage" target="_blank" rel="noopener"><b>Server Management</b><span>whatbox.ca ↗</span></a>
      <a href="https://sonarr.egilsson.me/" target="_blank" rel="noopener"><b>Episodes</b><span>sonarr.egilsson.me ↗</span></a>
      <a href="https://radarr.egilsson.me/" target="_blank" rel="noopener"><b>Movies</b><span>radarr.egilsson.me ↗</span></a>
      <a href="https://bazarr.egilsson.me/" target="_blank" rel="noopener"><b>Subtitles</b><span>bazarr.egilsson.me ↗</span></a>
      <a href="https://prowlarr.egilsson.me/" target="_blank" rel="noopener"><b>Indexers</b><span>prowlarr.egilsson.me ↗</span></a>
      <a href="https://qbittorrent.egilsson.me/" target="_blank" rel="noopener"><b>Torrents</b><span>qbittorrent.egilsson.me ↗</span></a>
      <a href="https://app.plex.tv/" target="_blank" rel="noopener"><b>Watch Plex</b><span>app.plex.tv ↗</span></a>
    </div>
  </section>
</main>
</body>
</html>
